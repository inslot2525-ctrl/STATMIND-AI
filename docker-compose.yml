# Production-like local stack: Postgres + API + separate job worker + frontend.
#   docker compose up --build
# Create your account in the UI, or: docker compose exec api python manage.py create-user you@example.com
#
# To use S3 / Cloudflare R2 / MinIO instead of the shared volume, set STORAGE_BACKEND=s3
# plus S3_BUCKET, S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY on api and worker.

x-backend-env: &backend-env
  PYTHONUNBUFFERED: "1"
  STATMIND_DATA_DIR: /data
  DATABASE_URL: postgresql+psycopg://statmind:statmind@db:5432/statmind
  JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-secret-at-least-32-chars}
  STORAGE_BACKEND: local
  JOB_BACKEND: worker

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: statmind
      POSTGRES_PASSWORD: statmind
      POSTGRES_DB: statmind
    volumes:
      - statmind-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Uploads, models, predictions and reports (shared with the worker)
      - statmind-data:/data
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "worker.py"]
    volumes:
      - statmind-data:/data
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy  # the API runs migrations on startup
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  statmind-data:
  statmind-db:
